<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가방 - Fake Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; }
        .gabang-orange { background-color: #ff6e12; } 
        .gabang-text-orange { color: #ff6e12; }
        .gabang-border-orange { border-color: #ff6e12; }
        .hidden { display: none; }
        .drag-over { background-color: #fff3e0 !important; border: 2px dashed #ff6e12 !important; }
    </style>
</head>
<body class="pb-24">

<header class="gabang-orange text-white p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-4xl mx-auto flex flex-col gap-3">
        <div class="flex justify-between items-center">
            <div onclick="showSection('home-section')" class="text-2xl font-black cursor-pointer tracking-tighter flex items-center gap-1">
                🎒 가방 <span class="text-xs font-normal opacity-80">(Fake Room)</span>
            </div>
            <div class="flex gap-4 items-center">
                <button onclick="showSection('bookmark-section')" class="relative text-sm font-bold bg-white text-[#ff6e12] px-3 py-1.5 rounded-full shadow-sm">
                    ⭐ 보관함 <span id="bookmark-count" class="bg-red-500 text-white text-[10px] rounded-full px-1.5 ml-0.5">0</span>
                </button>
            </div>
        </div>
        <div class="grid grid-cols-3 gap-2">
            <input type="text" id="region-search-input" onkeyup="if(event.key === 'Enter') executeSearch()" placeholder="📍 동 이름 검색 (예: 서교동)" class="col-span-1 p-2.5 rounded-lg text-black focus:outline-none text-xs shadow-inner bg-orange-50">
            <div class="col-span-2 relative">
                <input type="text" id="general-search-input" onkeyup="if(event.key === 'Enter') executeSearch()" placeholder="아파트, 빌라, 원룸 방 번호나 특징 검색" class="w-full p-2.5 rounded-lg text-black focus:outline-none text-xs shadow-inner">
                <button onclick="executeSearch()" class="absolute right-3 top-2.5 text-gray-400">🔍</button>
            </div>
        </div>
    </div>
</header>

<main class="max-w-4xl mx-auto p-4">
    
    <section id="home-section">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-black text-gray-800 flex items-center gap-1">🔥 오늘의 추천 매물</h2>
            <button onclick="showAddRoomModal()" class="gabang-orange text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow">+ 신규 매물 등록</button>
        </div>
        <div id="recommended-rooms-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            </div>
    </section>

    <section id="region-section" class="hidden">
        <div class="bg-white p-4 rounded-xl shadow-sm border mb-4 flex flex-col gap-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-base font-bold text-gray-800 flex items-center gap-1">📍 3단계 계층형 지역 관리</h2>
                <div class="flex gap-1">
                    <button onclick="showAddRegionHierarchyModal()" class="bg-amber-500 text-white px-2 py-1 rounded text-xs font-bold shadow-sm">➕ 추가</button>
                    <button onclick="showEditRegionHierarchyModal()" class="bg-blue-500 text-white px-2 py-1 rounded text-xs font-bold shadow-sm">✏️ 수정</button> <button onclick="showDeleteRegionHierarchyModal()" class="bg-red-500 text-white px-2 py-1 rounded text-xs font-bold shadow-sm">❌ 삭제</button>
                </div>
            </div>
            
            <div>
                <label class="text-[11px] font-bold text-gray-400 block mb-1">1단계: 시 / 도</label>
                <div id="sido-tags-container" class="flex flex-wrap gap-1.5"></div>
            </div>
            
            <div id="sigungu-wrapper" class="border-t pt-3 hidden">
                <label class="text-[11px] font-bold text-gray-400 block mb-1">2단계: 시 / 군 / 구</label>
                <div id="sigungu-tags-container" class="flex flex-wrap gap-1.5"></div>
            </div>
            
            <div id="dong-wrapper" class="border-t pt-3 hidden">
                <label class="text-[11px] font-bold text-gray-400 block mb-1">3단계: 읍 / 면 / 동</label>
                <div id="dong-tags-container" class="flex flex-wrap gap-1.5"></div>
            </div>
        </div>

        <div class="mb-2 flex justify-between items-center bg-gray-100 px-3 py-2 rounded-lg">
            <h3 id="current-region-title" class="text-sm font-bold text-gray-600">지역을 선택해 주세요.</h3>
            <button onclick="showAddRoomModal('region')" class="bg-blue-600 text-white px-2.5 py-1 rounded text-xs font-bold shadow hover:bg-blue-700">이 지역에 매물 올리기 +</button>
        </div>
        <div id="region-rooms-container" class="grid gap-4 mt-2"></div>
    </section>

    <section id="type-section" class="hidden">
        <div class="bg-white p-4 rounded-xl shadow-sm border mb-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-base font-bold text-gray-800">🏢 부동산 형태 카테고리 관리</h2>
                <div class="flex gap-1">
                    <button onclick="addTypeCategory()" class="bg-amber-500 text-white px-2 py-1 rounded text-xs font-bold shadow-sm">➕ 추가</button>
                    <button onclick="showEditTypeModal()" class="bg-blue-500 text-white px-2 py-1 rounded text-xs font-bold shadow-sm">✏️ 수정</button>
                    <button onclick="showDeleteTypeModal()" class="bg-red-500 text-white px-2 py-1 rounded text-xs font-bold shadow-sm">❌ 삭제</button>
                </div>
            </div>
            <div id="type-tags-container" class="flex flex-wrap gap-2"></div>
        </div>

        <div class="mb-2 flex justify-between items-center bg-gray-100 px-3 py-2 rounded-lg">
            <h3 id="current-type-title" class="text-sm font-bold text-gray-600">유형을 선택해 주세요.</h3>
            <button onclick="showAddRoomModal('type')" class="bg-blue-600 text-white px-2.5 py-1 rounded text-xs font-bold shadow hover:bg-blue-700">이 형태 매물 올리기 +</button>
        </div>
        <div id="type-rooms-container" class="grid gap-4 mt-2"></div>
    </section>

    <section id="search-section" class="hidden">
        <div class="border-b pb-2 mb-4 flex justify-between items-center">
            <h2 class="text-xl font-black text-gray-800">🔍 매물 검색 결과</h2>
            <span id="search-count" class="text-sm font-bold text-gray-400">0개의 매물</span>
        </div>
        <div id="search-rooms-container" class="grid gap-4"></div>
    </section>

    <section id="bookmark-section" class="hidden">
        <h2 class="text-xl font-black text-gray-800 mb-4">⭐ 내가 찜한 보관함 매물</h2>
        <div id="bookmark-rooms-container" class="grid gap-4"></div>
    </section>

    <section id="room-detail-section" class="hidden">
        <div id="room-detail-content" class="bg-white rounded-xl shadow-md overflow-hidden border">
            </div>
    </section>
</main>

<nav class="fixed bottom-0 inset-x-0 bg-white border-t shadow-lg z-50">
    <div class="max-w-4xl mx-auto grid grid-cols-5 text-center text-xs font-bold text-gray-500">
        <button onclick="showSection('home-section')" id="nav-home-section" class="py-3 flex flex-col items-center gap-1 gabang-text-orange">
            <span class="text-lg">🏠</span>홈
        </button>
        <button onclick="clickRegionNav()" id="nav-region-section" class="py-3 flex flex-col items-center gap-1 hover:text-[#ff6e12]">
            <span class="text-lg">📍</span>지역별
        </button>
        <button onclick="clickTypeNav()" id="nav-type-section" class="py-3 flex flex-col items-center gap-1 hover:text-[#ff6e12]">
            <span class="text-lg">🏢</span>방 형태별
        </button>
        <button onclick="showSection('search-section')" id="nav-search-section" class="py-3 flex flex-col items-center gap-1 hover:text-[#ff6e12]">
            <span class="text-lg">🔍</span>상세검색
        </button>
        <button onclick="showSection('bookmark-section')" id="nav-bookmark-section" class="py-3 flex flex-col items-center gap-1 hover:text-[#ff6e12]">
            <span class="text-lg">⭐</span>보관함
        </button>
    </div>
</nav>

<div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-[100]">
    <div class="bg-white w-full max-w-md p-6 rounded-xl shadow-2xl">
        <h3 id="modal-title" class="text-lg font-bold mb-4 text-gray-800">정보 입력</h3>
        <div id="modal-content" class="flex flex-col gap-3 max-h-[60vh] overflow-y-auto text-xs text-gray-700"></div>
        <div class="flex gap-2 mt-6">
            <button onclick="closeModal()" class="flex-1 py-2 bg-gray-200 rounded font-bold text-sm text-gray-600">취소</button>
            <button id="modal-confirm-btn" class="flex-1 py-2 gabang-orange text-white rounded font-bold text-sm">확인</button>
        </div>
    </div>
</div>

<script>
    // 데이터 스키마 (localStorage 연동 v4)
    let db = JSON.parse(localStorage.getItem('gabangDB_v4')) || {
        regionHierarchy: {
            "서울특별시": {
                "마포구": ["서교동", "망원동", "공덕동"],
                "강남구": ["역삼동", "삼성동", "신사동"]
            },
            "부산광역시": {
                "해운대구": ["우동", "중동", "재송동"],
                "진구": ["부전동", "전포동"]
            }
        },
        types: ["원룸", "투룸", "오피스텔", "아파트"],
        bookmarks: [],
        rooms: [
            {
                id: 1,
                title: "홍대입구역 도보 3분 초역세권 원룸",
                sido: "서울특별시",
                sigungu: "마포구",
                dong: "서교동",
                type: "원룸",
                priceType: "월세",
                deposit: 1000,
                rent: 60,
                desc: "풀옵션, 채광 최상, 주변 편의시설 완비되어 살기 정말 좋습니다.",
                img: "",
                spec: "방 1개 / 욕실 1개 / 26㎡"
            },
            {
                id: 2,
                title: "해운대 오션뷰 랜드마크 아파트 초초매매",
                sido: "부산광역시",
                sigungu: "해운대구",
                dong: "우동",
                type: "아파트",
                priceType: "매매",
                deposit: 145000,
                rent: 0,
                desc: "해운대 백사장 도보 1분 거리. 파노라마 바다 조망권 보장 및 주거 인프라 최상.",
                img: "",
                spec: "방 3개 / 욕실 2개 / 112㎡"
            }
        ]
    };

    let currentSido = "";
    let currentSigungu = "";
    let currentDong = "";
    let selectedTypeFilter = "all";

    function init() {
        renderHomeRooms();
        updateBookmarkCount();
    }

    function saveDB() { localStorage.setItem('gabangDB_v4', JSON.stringify(db)); }

    // 이미지 드래그앤드롭 핸들러
    function handleImageDrop(e, inputId) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (event) => {
                document.getElementById(inputId).value = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    }
    function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }

    // 라우터 뷰 체인저
    function showSection(id) {
        document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('gabang-text-orange'));
        const activeNav = document.getElementById('nav-' + id);
        if (activeNav) activeNav.classList.add('gabang-text-orange');

        window.scrollTo(0, 0);

        if (id === 'home-section') renderHomeRooms();
        if (id === 'bookmark-section') renderBookmarkRooms();
        if (id === 'region-section') renderRegionStep1();
        if (id === 'type-section') renderTypeTabs();
    }

    function clickRegionNav() {
        const sidos = Object.keys(db.regionHierarchy);
        if(!currentSido) {
            currentSido = sidos[0] || "";
            currentSigungu = currentSido ? Object.keys(db.regionHierarchy[currentSido])[0] || "" : "";
            currentDong = (currentSido && currentSigungu) ? db.regionHierarchy[currentSido][currentSigungu][0] || "" : "";
        }
        showSection('region-section');
    }

    function clickTypeNav() {
        if(selectedTypeFilter === "all") selectedTypeFilter = db.types[0] || "all";
        showSection('type-section');
    }

    function renderHomeRooms() {
        const container = document.getElementById('recommended-rooms-container');
        container.innerHTML = "";
        if (db.rooms.length === 0) {
            container.innerHTML = `<div class='col-span-full text-center py-12 text-gray-400 font-bold'>등록된 매물이 없습니다.</div>`;
            return;
        }
        db.rooms.forEach(room => container.appendChild(createRoomCard(room)));
    }

    // ==========================================
    // 3단계 지역 계층 탭 렌더링 파트
    // ==========================================
    function renderRegionStep1() {
        const sidoContainer = document.getElementById('sido-tags-container');
        sidoContainer.innerHTML = "";
        Object.keys(db.regionHierarchy).forEach(sido => {
            const btn = document.createElement('button');
            btn.className = `px-2.5 py-1 rounded-md font-bold transition-all ${currentSido === sido ? 'gabang-orange text-white' : 'bg-gray-100 text-gray-600'}`;
            btn.innerText = sido;
            btn.onclick = () => {
                currentSido = sido;
                const sigungus = Object.keys(db.regionHierarchy[sido] || {});
                currentSigungu = sigungus[0] || "";
                currentDong = currentSigungu ? db.regionHierarchy[sido][currentSigungu][0] || "" : "";
                renderRegionStep1();
            };
            sidoContainer.appendChild(btn);
        });
        renderRegionStep2();
    }

    function renderRegionStep2() {
        const wrapper = document.getElementById('sigungu-wrapper');
        const sigunguContainer = document.getElementById('sigungu-tags-container');
        sigunguContainer.innerHTML = "";

        if (!currentSido || !db.regionHierarchy[currentSido] || Object.keys(db.regionHierarchy[currentSido]).length === 0) {
            wrapper.classList.add('hidden');
            document.getElementById('dong-wrapper').classList.add('hidden');
            renderRegionRooms();
            return;
        }

        wrapper.classList.remove('hidden');
        Object.keys(db.regionHierarchy[currentSido]).forEach(sigungu => {
            const btn = document.createElement('button');
            btn.className = `px-2.5 py-1 rounded-md font-bold transition-all ${currentSigungu === sigungu ? 'bg-gray-800 text-white' : 'bg-gray-100 text-gray-600'}`;
            btn.innerText = sigungu;
            btn.onclick = () => {
                currentSigungu = sigungu;
                currentDong = db.regionHierarchy[currentSido][sigungu][0] || "";
                renderRegionStep2();
            };
            sigunguContainer.appendChild(btn);
        });
        renderRegionStep3();
    }

    function renderRegionStep3() {
        const wrapper = document.getElementById('dong-wrapper');
        const dongContainer = document.getElementById('dong-tags-container');
        dongContainer.innerHTML = "";

        if (!currentSigungu || !db.regionHierarchy[currentSido][currentSigungu] || db.regionHierarchy[currentSido][currentSigungu].length === 0) {
            wrapper.classList.add('hidden');
            renderRegionRooms();
            return;
        }

        wrapper.classList.remove('hidden');
        db.regionHierarchy[currentSido][currentSigungu].forEach(dong => {
            const btn = document.createElement('button');
            btn.className = `px-2.5 py-1 rounded-md font-bold transition-all ${currentDong === dong ? 'border-2 border-[#ff6e12] text-[#ff6e12] bg-orange-50' : 'bg-gray-100 text-gray-600'}`;
            btn.innerText = dong;
            btn.onclick = () => { currentDong = dong; renderRegionStep3(); };
            dongContainer.appendChild(btn);
        });
        renderRegionRooms();
    }

    function renderRegionRooms() {
        const titleEl = document.getElementById('current-region-title');
        const container = document.getElementById('region-rooms-container');
        container.innerHTML = "";

        if(!currentSido) {
            titleEl.innerText = "선택된 지역이 없습니다.";
            return;
        }

        let label = `📍 ${currentSido}`;
        if(currentSigungu) label += ` ➡️ ${currentSigungu}`;
        if(currentDong) label += ` ➡️ ${currentDong}`;
        titleEl.innerText = label;

        const filtered = db.rooms.filter(r => 
            r.sido === currentSido && 
            (!currentSigungu || r.sigungu === currentSigungu) && 
            (!currentDong || r.dong === currentDong)
        );

        if(filtered.length === 0) {
            container.innerHTML = `<div class='text-center py-12 bg-white border border-dashed rounded-xl text-gray-400 font-bold'>해당 세부 구역에 등록된 방이 없습니다.</div>`;
        } else {
            filtered.forEach(room => container.appendChild(createRoomCard(room)));
        }
    }

    // ==========================================
    // ⭐️ [신규 기능 추가] 계층형 지역 카테고리 명칭 수정 모달 엔진
    // ==========================================
    function showEditRegionHierarchyModal() {
        let optionsHtml = "";
        // 유저가 선택 및 탐색하기 쉽도록 1단계, 2단계, 3단계 노드 경로를 쪼개서 셀렉트 옵션으로 컴파일 구성
        Object.keys(db.regionHierarchy).forEach(sido => {
            optionsHtml += `<option value="sido|${sido}|-|-" class="font-bold text-orange-600">[1단계 시/도] ${sido}</option>`;
            Object.keys(db.regionHierarchy[sido]).forEach(sigungu => {
                optionsHtml += `<option value="sigungu|${sido}|${sigungu}|-">&nbsp;&nbsp;[2단계 시/군/구] ${sido} > ${sigungu}</option>`;
                db.regionHierarchy[sido][sigungu].forEach(dong => {
                    optionsHtml += `<option value="dong|${sido}|${sigungu}|${dong}">&nbsp;&nbsp;&nbsp;&nbsp;[3단계 읍/면/동] ${sido} > ${sigungu} > ${dong}</option>`;
                });
            });
        });

        if(!optionsHtml) return alert("수정 변경을 가할 지리 행정구역 카테고리가 비어있습니다.");

        openModal("✏️ 계층형 지역 명칭 수정", `
            <div class="mb-3">
                <label class="font-bold text-gray-500 block mb-1">수정할 카테고리 단계 선택</label>
                <select id="modal-edit-region-path" class="w-full border p-2.5 rounded bg-white text-xs">${optionsHtml}</select>
            </div>
            <div>
                <label class="font-bold text-gray-500 block mb-1">새로운 변경 명칭 입력</label>
                <input id="modal-edit-region-name" type="text" placeholder="예: 세종특별자치시 / 기장군 / 우동" class="w-full border p-2.5 rounded text-xs">
            </div>
        `, () => {
            const pathInfo = document.getElementById('modal-edit-region-path').value;
            const newName = document.getElementById('modal-edit-region-name').value.trim();
            
            if(!newName) return alert("공백 명칭으로 카테고리를 변경할 수 없습니다.");
            
            const [level, sido, sigungu, dong] = pathInfo.split('|');

            if(level === 'sido') {
                if(db.regionHierarchy[newName]) return alert("이미 대동소이하게 존재하는 동명의 시/도 카테고리가 있습니다.");
                
                // 1. 객체 키값 마이그레이션 교체 연동
                db.regionHierarchy[newName] = db.regionHierarchy[sido];
                delete db.regionHierarchy[sido];
                
                // 2. 소속 소유 매물들의 'sido' 메타데이터 실시간 대치 업데이트 처리
                db.rooms.forEach(r => { if(r.sido === sido) r.sido = newName; });
                currentSido = newName;

            } else if(level === 'sigungu') {
                if(db.regionHierarchy[sido][newName]) return alert("해당 시/도 내부 노드에 이미 동일한 시/군/구가 배치되어 있습니다.");
                
                db.regionHierarchy[sido][newName] = db.regionHierarchy[sido][sigungu];
                delete db.regionHierarchy[sido][sigungu];
                
                db.rooms.forEach(r => { if(r.sido === sido && r.sigungu === sigungu) r.sigungu = newName; });
                currentSigungu = newName;

            } else if(level === 'dong') {
                const dongArray = db.regionHierarchy[sido][sigungu];
                if(dongArray.includes(newName)) return alert("해당 구역 내에 이미 존재하는 동일한 동 명칭 분류입니다.");
                
                const idx = dongArray.indexOf(dong);
                if(idx > -1) {
                    dongArray[idx] = newName;
                }
                
                db.rooms.forEach(r => { if(r.sido === sido && r.sigungu === sigungu && r.dong === dong) r.dong = newName; });
                currentDong = newName;
            }

            saveDB();
            closeModal();
            renderRegionStep1();
        });
    }

    // 방 형태별 카테고리 뷰 레이아웃
    function renderTypeTabs() {
        const tagBox = document.getElementById('type-tags-container');
        tagBox.innerHTML = "";
        db.types.forEach(t => {
            const btn = document.createElement('button');
            btn.className = `px-3 py-1.5 rounded-full text-xs font-bold transition-all ${selectedTypeFilter === t ? 'gabang-orange text-white' : 'bg-gray-100 text-gray-600'}`;
            btn.innerText = `🏢 ${t}`;
            btn.onclick = () => { selectedTypeFilter = t; renderTypeTabs(); };
            tagBox.appendChild(btn);
        });

        const titleEl = document.getElementById('current-type-title');
        titleEl.innerText = `🏢 선택된 방 형태: [ ${selectedTypeFilter} ]`;

        const listContainer = document.getElementById('type-rooms-container');
        listContainer.innerHTML = "";
        const filtered = db.rooms.filter(r => r.type === selectedTypeFilter);

        if(filtered.length === 0) {
            listContainer.innerHTML = `<div class='text-center py-10 bg-white border border-dashed rounded-xl text-gray-400 font-bold'>해당 유형의 방이 존재하지 않습니다.</div>`;
        } else {
            filtered.forEach(room => listContainer.appendChild(createRoomCard(room)));
        }
    }

    function renderBookmarkRooms() {
        const container = document.getElementById('bookmark-rooms-container');
        container.innerHTML = "";
        const bookmarked = db.rooms.filter(r => db.bookmarks.includes(r.id));
        if(bookmarked.length === 0) container.innerHTML = "<div class='text-center py-12 bg-white border rounded-xl text-gray-400 font-bold text-sm'>보관함이 비어있습니다.</div>";
        else bookmarked.forEach(room => container.appendChild(createRoomCard(room)));
    }

    function executeSearch() {
        const regQuery = document.getElementById('region-search-input').value.trim();
        const genQuery = document.getElementById('general-search-input').value.trim();

        showSection('search-section');
        const container = document.getElementById('search-rooms-container');
        container.innerHTML = "";

        let results = db.rooms;
        if (regQuery) results = results.filter(r => r.dong.includes(regQuery) || r.sigungu.includes(regQuery) || r.sido.includes(regQuery));
        if (genQuery) results = results.filter(r => r.title.includes(genQuery) || r.desc.includes(genQuery) || r.type.includes(genQuery) || r.priceType.includes(genQuery));

        document.getElementById('search-count').innerText = `${results.length}개의 매물`;
        if (results.length === 0) container.innerHTML = "<div class='text-center py-12 text-gray-400 font-bold'>일치하는 방이 없습니다.</div>";
        else results.forEach(room => container.appendChild(createRoomCard(room)));
    }

    // 매물 전용 공용 컴포넌트 카드 UI
    function createRoomCard(room) {
        const div = document.createElement('div');
        div.className = `bg-white border rounded-xl shadow-sm overflow-hidden flex flex-col cursor-pointer hover:shadow-md transition-shadow relative`;
        
        const imgHtml = room.img 
            ? `<img src="${room.img}" class="w-full h-44 object-cover">`
            : `<div class="w-full h-44 bg-gray-100 flex flex-col items-center justify-center text-gray-400 text-xs">🏠 등록된 이미지 없음</div>`;

        let priceText = "";
        if (room.priceType === "매매") priceText = `<span class="text-red-600">매매</span> ${(room.deposit).toLocaleString()}만원`;
        else if (room.priceType === "전세") priceText = `<span class="text-blue-500">전세</span> ${(room.deposit).toLocaleString()}만원`;
        else priceText = `<span class="text-orange-500">월세</span> ${room.deposit}/${room.rent}`;

        const isFav = db.bookmarks.includes(room.id);

        div.innerHTML = `
            <div onclick="showRoomDetail(${room.id})">
                ${imgHtml}
                <div class="p-4">
                    <p class="text-lg font-black text-gray-900 mb-1">${priceText}</p>
                    <p class="text-[11px] font-bold text-gray-400 mb-1">${room.type} · ${room.sido} ${room.sigungu} ${room.dong}</p>
                    <h3 class="text-sm font-bold text-gray-700 truncate">${room.title}</h3>
                    <p class="text-xs text-gray-400 mt-1 truncate">${room.desc}</p>
                </div>
            </div>
            <div class="absolute top-2 right-2 flex gap-1 z-10">
                <button onclick="toggleBookmark(event, ${room.id})" class="bg-white/90 p-1.5 rounded-full shadow-sm text-sm">${isFav ? '⭐' : '☆'}</button>
                <button onclick="showEditRoomModal(event, ${room.id})" class="bg-white/95 text-blue-500 font-bold text-[10px] px-2 py-1 rounded shadow-sm">수정</button>
                <button onclick="deleteRoom(event, ${room.id})" class="bg-white/95 text-red-500 font-bold text-[10px] px-2 py-1 rounded shadow-sm">삭제</button>
            </div>
        `;
        return div;
    }

            if(depositLabel) depositLabel.innerText = "전세 보증금 (만원)";

    function triggerFakeContractSimulation(roomTitle) {
        openModal("📄 가상 전자계약 시스템 구동", `
            <div class="text-center py-4 flex flex-col items-center gap-2">
                <div id="contract-icon" class="text-4xl animate-bounce">✍️</div>
                <h4 id="contract-status" class="text-sm font-bold text-gray-800">[${roomTitle}] 계약 원장 승인 검토 중...</h4>
                <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden mt-3">
                    <div id="contract-progress" class="bg-orange-500 h-full transition-all duration-700" style="width: 10%"></div>
                </div>
            </div>
        `, null);

        const cfBtn = document.getElementById('modal-confirm-btn');
        cfBtn.disabled = true; cfBtn.classList.add('opacity-40');

        const steps = [
            { p: 40, text: "🔒 국토교통부 가상 네트워크 부동산 전자계약 원장 매핑 중...", icon: "📡" },
            { p: 70, text: "🔑 위조 방지 가상 블록체인 타임스탬프 서명 날인 검증 중...", icon: "🔐" },
            { p: 100, text: "❌ 계약 체결 불가능 거부 실패 처리 알림", icon: "⚠️" }
        ];

        let stepIdx = 0;
        const interval = setInterval(() => {
            if(stepIdx < steps.length) {
                document.getElementById('contract-progress').style.width = steps[stepIdx].p + "%";
                document.getElementById('contract-status').innerText = steps[stepIdx].text;
                document.getElementById('contract-icon').innerText = steps[stepIdx].icon;
                if(stepIdx === steps.length - 1) {
                    clearInterval(interval);
                    document.getElementById('contract-status').innerHTML = `
                        <span class="text-red-600 font-black text-base">최종 체결 거부 실패</span><br>
                        <p class="text-[11px] text-gray-500 mt-2 font-normal">이 플랫폼은 가짜 부동산 중개 중개 시뮬레이터이므로 계약 서명이 차단됩니다.</p>
                    `;
                    cfBtn.disabled = false; cfBtn.classList.remove('opacity-40'); cfBtn.onclick = closeModal;
                }
                stepIdx++;
            }
        }, 1200);
    }

    // 부동산 형태 카테고리 기법 제어
    function addTypeCategory() {
        const newType = prompt("새로운 부동산 형태 카테고리를 명명하세요:");
        if(newType && newType.trim() !== "") {
            const cleaned = newType.trim();
            if(!db.types.includes(cleaned)) { db.types.push(cleaned); saveDB(); renderTypeTabs(); } 
            else alert("이미 존재하는 분류입니다.");
        }
    }

    function showEditTypeModal() {
        if(db.types.length === 0) return alert("수정할 항목이 없습니다.");
        openModal("⚙️ 부동산 형태 명칭 수정", `
            <select id="edit-type-idx" class="w-full border p-2 rounded bg-white mb-2">${db.types.map((t, i) => `<option value="${i}">${t}</option>`).join('')}</select>
            <input id="edit-type-name" type="text" placeholder="변경할 형태 명칭 직접 입력" class="w-full border p-2 rounded">
        `, () => {
            const idx = parseInt(document.getElementById('edit-type-idx').value);
            const newName = document.getElementById('edit-type-name').value.trim();
            if(!newName) return alert("공백 명칭 처리는 제한됩니다.");
            const oldName = db.types[idx];
            db.rooms.forEach(r => { if(r.type === oldName) r.type = newName; });
            db.types[idx] = newName; selectedTypeFilter = newName;
            saveDB(); closeModal(); renderTypeTabs();
        });
    }

    function showDeleteTypeModal() {
        if(db.types.length === 0) return alert("삭제할 항목이 없습니다.");
        openModal("❌ 부동산 형태 카테고리 제거", `
            <select id="delete-type-idx" class="w-full border p-2 rounded bg-white">${db.types.map((t, i) => `<option value="${i}">${t}</option>`).join('')}</select>
        `, () => {
            const idx = parseInt(document.getElementById('delete-type-idx').value);
            const targetName = db.types[idx];
            if(confirm(`[${targetName}] 분류를 지우시겠습니까?`)) {
                db.types.splice(idx, 1);
                selectedTypeFilter = db.types[0] || "all";
                saveDB();
            }
            closeModal(); renderTypeTabs();
        });
    }

    function showAddRegionHierarchyModal() {
        let sidoOptions = `<option value="new">+ 직접 새로 추가</option>` + Object.keys(db.regionHierarchy).map(s => `<option value="${s}">${s}</option>`).join('');
        openModal("📍 세분화 지역 카테고리 추가", `
            <div class="mb-2">
                <label class="font-bold text-gray-500 block mb-1">1단계: 시/도 선택</label>
                <select id="modal-add-sido-select" onchange="onModalSidoChange()" class="w-full border p-2 rounded bg-white">${sidoOptions}</select>
                <input id="modal-add-sido-input" type="text" placeholder="새 시/도 입력 (예: 경기도)" class="w-full border p-2 rounded mt-1">
            </div>
            <div class="mb-2">
                <label class="font-bold text-gray-500 block mb-1">2단계: 시/군/구 입력</label>
                <input id="modal-add-sigungu-input" type="text" placeholder="시/군/구 입력 (예: 수원시)" class="w-full border p-2 rounded">
            </div>
            <div class="mb-2">
                <label class="font-bold text-gray-500 block mb-1">3단계: 읍/면/동 입력</label>
                <input id="modal-add-dong-input" type="text" placeholder="읍/면/동 입력 (예: 인계동)" class="w-full border p-2 rounded">
            </div>
        `, () => {
            const selectSido = document.getElementById('modal-add-sido-select').value;
            let targetSido = selectSido === 'new' ? document.getElementById('modal-add-sido-input').value.trim() : selectSido;
            const targetSigungu = document.getElementById('modal-add-sigungu-input').value.trim();
            const targetDong = document.getElementById('modal-add-dong-input').value.trim();

            if(!targetSido || !targetSigungu || !targetDong) return alert("모든 계층 항목을 기입해 주십시오.");
            if(!db.regionHierarchy[targetSido]) db.regionHierarchy[targetSido] = {};
            if(!db.regionHierarchy[targetSido][targetSigungu]) db.regionHierarchy[targetSido][targetSigungu] = [];
            if(!db.regionHierarchy[targetSido][targetSigungu].includes(targetDong)) db.regionHierarchy[targetSido][targetSigungu].push(targetDong);

            currentSido = targetSido; currentSigungu = targetSigungu; currentDong = targetDong;
            saveDB(); closeModal(); renderRegionStep1();
        });
        onModalSidoChange();
    }
    function onModalSidoChange() {
        const sel = document.getElementById('modal-add-sido-select').value;
        const input = document.getElementById('modal-add-sido-input');
        if(sel === 'new') input.classList.remove('hidden'); else input.classList.add('hidden');
    }

    function showDeleteRegionHierarchyModal() {
        let optionsHtml = "";
        Object.keys(db.regionHierarchy).forEach(sido => {
            Object.keys(db.regionHierarchy[sido]).forEach(sigungu => {
                db.regionHierarchy[sido][sigungu].forEach(dong => {
                    optionsHtml += `<option value="${sido}|${sigungu}|${dong}">${sido} > ${sigungu} > ${dong}</option>`;
                });
            });
        });
        if(!optionsHtml) return alert("삭제할 항목이 없습니다.");
        openModal("❌ 세분화 지역 카테고리 제거", `<select id="modal-delete-region-path" class="w-full border p-2.5 rounded bg-white">${optionsHtml}</select>`, () => {
            const path = document.getElementById('modal-delete-region-path').value;
            const [sido, sigungu, dong] = path.split('|');
            if(confirm(`[${sido} > ${sigungu} > ${dong}] 지리 데이터를 노드에서 제외하시겠습니까?`)) {
                db.regionHierarchy[sido][sigungu] = db.regionHierarchy[sido][sigungu].filter(d => d !== dong);
                if(db.regionHierarchy[sido][sigungu].length === 0) delete db.regionHierarchy[sido][sigungu];
                if(Object.keys(db.regionHierarchy[sido]).length === 0) delete db.regionHierarchy[sido];
                const remainingSidos = Object.keys(db.regionHierarchy);
                currentSido = remainingSidos[0] || "";
                currentSigungu = currentSido ? Object.keys(db.regionHierarchy[currentSido])[0] || "" : "";
                currentDong = (currentSido && currentSigungu) ? db.regionHierarchy[currentSido][currentSigungu][0] || "" : "";
                saveDB();
            }
            closeModal(); renderRegionStep1();
        });
    }

    function openModal(title, content, onConfirm) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-content').innerHTML = content;
        const confirmBtn = document.getElementById('modal-confirm-btn');
        confirmBtn.disabled = false; confirmBtn.classList.remove('opacity-40');
        if (onConfirm) { confirmBtn.onclick = onConfirm; confirmBtn.classList.remove('hidden'); }
        else { confirmBtn.classList.add('hidden'); }
        document.getElementById('modal').classList.remove('hidden');
    }
    function closeModal() { document.getElementById('modal').classList.add('hidden'); }

    init();
</script>
</body>
</html>
